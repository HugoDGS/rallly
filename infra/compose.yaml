# Stack Rallly + Authentik derrière Caddy.
# Même fichier en local et sur la VM : seul le .env change.
#
# Sur tous les services : redémarrage auto, aucune capacité Linux par défaut
# (cap_drop: ALL) et pas d'élévation de privilèges (no-new-privileges).

services:
  caddy:
    image: docker.io/library/caddy:2.11-alpine
    restart: unless-stopped
    user: "65534:65534" # nobody
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # demandée par le binaire caddy
    read_only: true
    tmpfs: [/data, /config]
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}" # seul port publié de la stack
    environment:
      DOMAIN: ${DOMAIN}
      HTTP_PORT: ${HTTP_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      front:
        # Rallly doit joindre Authentik avec la même URL que le navigateur,
        # sinon l'issuer OIDC ne correspond pas.
        aliases: ["${DOMAIN}", "auth.${DOMAIN}"]

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] # démarre en root puis passe en postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: authentik
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # crée la base rallly
    networks: [back]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "authentik"]
      interval: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: server
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 512mb
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: app
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__FROM: authentik@${DOMAIN}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [front, back]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: worker
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 512mb
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: app
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__FROM: authentik@${DOMAIN}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # Compte akadmin, créé au premier démarrage
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@${DOMAIN}
      # Variables lues par le blueprint (!Env)
      DOMAIN: ${DOMAIN}
      HTTP_PORT: ${HTTP_PORT}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [front, back]

  rallly:
    # Image construite et publiée par la CI (docker compose pull).
    # En dev, compose.dev.yaml remplace ce service par le code monté en direct.
    image: ${RALLLY_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://app:${PG_PASS}@postgres:5432/rallly
      SECRET_PASSWORD: ${RALLLY_SECRET}
      NEXT_PUBLIC_BASE_URL: http://${DOMAIN}:${HTTP_PORT}
      SUPPORT_EMAIL: support@${DOMAIN}
      NOREPLY_EMAIL: noreply@${DOMAIN}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_LOGIN_ENABLED: "false" # connexion uniquement via Authentik
      OIDC_NAME: Authentik
      OIDC_DISCOVERY_URL: http://auth.${DOMAIN}:${HTTP_PORT}/application/o/rallly/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [front, back]

  mailpit:
    image: docker.io/axllent/mailpit:v1.31
    restart: unless-stopped
    user: "65534:65534" # nobody
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp] # boîte mail de test, pas conservée
    networks: [front]

networks:
  front:
  back:
    internal: true # pas d'accès à Internet depuis ce réseau

volumes:
  postgres:
